<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- Stethoscope head -->
  <circle cx="50" cy="65" r="18" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="50" cy="65" r="8" fill="#ffffff"/>
  
  <!-- Stethoscope tubing -->
  <path d="M32 65 Q20 55 25 35 Q30 20 40 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M68 65 Q80 55 75 35 Q70 20 60 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Ear pieces -->
  <circle cx="40" cy="18" r="6" fill="#ffffff"/>
  <circle cx="60" cy="18" r="6" fill="#ffffff"/>
  
  <!-- AI indicator - small pulse -->
  <circle cx="50" cy="65" r="3" fill="#14b8a6">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
